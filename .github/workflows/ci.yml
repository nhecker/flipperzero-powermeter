name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run host tests
        run: make -C tests check

  build:
    name: build fap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache ufbt SDK and toolchain
        uses: actions/cache@v4
        with:
          path: ~/.ufbt
          key: ufbt-release-${{ hashFiles('application.fam') }}
          restore-keys: ufbt-release-

      - name: Install ufbt
        run: pip install --upgrade ufbt

      - name: Bootstrap SDK
        run: ufbt update --channel=release

      - name: Check formatting
        run: ufbt lint

      - name: Build
        run: ufbt

      - uses: actions/upload-artifact@v4
        with:
          name: powermeter-fap
          path: dist/powermeter.fap
          if-no-files-found: error

  release:
    name: publish release
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: powermeter-fap
          path: dist

      - name: Create release and attach fap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/powermeter.fap
